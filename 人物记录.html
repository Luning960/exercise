<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人物 · 人生阶段</title>
<style>
  :root {
    --bg: #042352;
    --deep: #021533;
    --surface: #0b2d62;
    --fg: #f6f3ec;
    --muted: #9eb0c6;
    --line: #1d447c;
    --accent: #c9a36a;
    --font-cn: "Songti SC", STSong, "Noto Serif CJK SC", "WenQuanYi Zen Hei", serif;
    --font-en: Cambria, "Times New Roman", "Liberation Serif", serif;
    --font-body: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", "WenQuanYi Zen Hei", sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  html[lang="zh-CN"] body { font-family: var(--font-body); }
  html[lang="en"] body { font-family: var(--font-en); }
  body { min-height: 100%; line-height: 1.5; font-size: 15px; }
  button, [role="button"] { cursor: pointer; }
  button:disabled { cursor: default; opacity: .45; }
  ::selection { background: var(--accent); color: var(--deep); }
  ::placeholder { color: var(--muted); opacity: 1; }
  [hidden] { display: none !important; }
  .num, input[type="number"] { font-family: var(--font-en); }
  h1, h2, h3 { font-weight: 500; }
  h1, .panel-head h2, html[lang="zh-CN"] .lib-card h3 {
    font-family: var(--font-cn);
    letter-spacing: .22em;
  }
  html[lang="en"] h1,
  html[lang="en"] .panel-head h2,
  html[lang="en"] .lib-card h3 {
    font-family: var(--font-en);
    letter-spacing: .22em;
  }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 20px 20px 56px; }
  .topbar {
    position: sticky; top: 0; z-index: 4;
    background: var(--bg);
    padding-bottom: 16px;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--line);
  }
  header { display: flex; justify-content: space-between; gap: 16px; align-items: flex-end; flex-wrap: wrap; }
  .brand { display: flex; align-items: baseline; gap: 12px; }
  .brand-cn { font-family: var(--font-cn); letter-spacing: .22em; font-size: 22px; }
  .brand-en { font-family: var(--font-en); letter-spacing: .22em; font-size: 13px; color: var(--muted); text-transform: uppercase; }
  html[lang="en"] .brand-en { color: var(--fg); font-size: 22px; }
  html[lang="en"] .brand-cn { color: var(--muted); font-size: 13px; }
  h1 { margin: 10px 0 0; font-size: 36px; line-height: 1.15; }
  .sub { margin: 8px 0 0; color: var(--muted); font-size: 14px; letter-spacing: 0; }
  .header-actions, .controls, .modal-actions, .lib-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  button {
    font: inherit;
    min-height: 44px;
    padding: 0 14px;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--fg);
    letter-spacing: .06em;
  }
  button:hover { border-color: var(--accent); }
  button.is-active { border-color: var(--accent); color: var(--accent); }

  .progress { display: flex; list-style: none; margin: 16px 0 0; padding: 0; border: 1px solid var(--line); }
  .progress li { flex: 1; display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-right: 1px solid var(--line); color: var(--muted); min-width: 0; }
  .progress li:last-child { border-right: 0; }
  .badge {
    flex: 0 0 auto;
    min-width: 32px; height: 28px;
    display: grid; place-items: center;
    border: 1px solid var(--line);
    font-family: var(--font-en);
    font-size: 13px;
    color: var(--muted);
  }
  .progress .lab { font-size: 13px; letter-spacing: .08em; }
  .progress li.is-done { color: var(--fg); }
  .progress li.is-done .badge { background: var(--accent); border-color: var(--accent); color: var(--deep); }
  .progress li.is-current { color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
  .progress li.is-current .badge { border-color: var(--accent); color: var(--accent); }
  .progress li.is-done.is-current .badge {
    background: var(--accent);
    color: var(--deep);
    outline: 1px solid var(--accent);
    outline-offset: 3px;
  }

  .layout { display: grid; grid-template-columns: minmax(300px, 400px) minmax(0, 1fr); gap: 16px; align-items: start; }
  .stack { display: grid; gap: 16px; }
  .panel { background: var(--surface); border: 1px solid var(--line); padding: 16px; min-width: 0; }
  .panel.is-current { box-shadow: inset 3px 0 0 var(--accent); }
  .is-locked { pointer-events: none; opacity: .35; }
  .panel-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .panel-head h2 { margin: 0; font-size: 15px; line-height: 1.45; }
  .kicker { color: var(--accent); font-family: var(--font-en); font-size: 14px; }

  label.field { display: grid; gap: 4px; }
  .field > span, .hint, .drop-sub, .drop-count { color: var(--muted); font-size: 12px; letter-spacing: .04em; }
  input[type="text"], input[type="number"] {
    width: 100%;
    min-height: 44px;
    padding: 8px 12px;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--fg);
    border-radius: 0;
    font: inherit;
  }
  input[type="number"] { font-family: var(--font-en); }
  input:focus { outline: none; border-color: var(--accent); }
  button:focus-visible, .thumb:focus-visible, .slider:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
  .name-state { min-height: 1.2em; margin: 8px 0 0; font-size: 12px; color: var(--muted); }
  .name-state.is-ok { color: var(--accent); }

  .drop {
    display: grid;
    gap: 6px;
    place-items: center;
    text-align: center;
    min-height: 132px;
    padding: 18px;
    border: 1px dashed var(--line);
    background: transparent;
    cursor: pointer;
  }
  .drop:hover, .drop.is-hot { border-color: var(--accent); }
  .drop-title { letter-spacing: .08em; }
  .sr {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); border: 0;
  }

  .edit-list { display: grid; gap: 8px; max-height: 520px; overflow: auto; }
  .edit {
    display: grid;
    grid-template-columns: 72px minmax(0, 1fr);
    gap: 10px;
    align-items: center;
    padding: 8px;
    background: var(--deep);
    border: 1px solid var(--line);
  }
  .shot-wrap { position: relative; width: 72px; height: 96px; }
  .shot { width: 72px; height: 96px; object-fit: cover; display: block; border: 1px solid var(--line); }
  .shot-idx {
    position: absolute; z-index: 1; left: 0; top: 0;
    padding: 2px 5px; color: var(--accent); background: var(--deep);
    font-size: 12px; letter-spacing: .04em;
    border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
  }
  .fields { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px; align-items: end; }
  .grow { grid-column: 1 / -1; margin: 0; color: var(--accent); font-size: 12px; letter-spacing: .04em; }
  .remove { justify-self: start; }

  .empty {
    min-height: 280px;
    display: grid;
    place-items: center;
    text-align: center;
    color: var(--muted);
    border: 1px dashed var(--line);
    padding: 24px;
    margin: 0;
  }
  .stage-row { display: grid; grid-template-columns: 44px minmax(0, 360px) 44px; justify-content: center; align-items: center; gap: 12px; }
  .stage { width: 100%; aspect-ratio: 3 / 4; background: var(--deep); border: 1px solid var(--line); overflow: hidden; }
  .stage img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 1; transition: opacity .28s ease; }
  .arrow {
    width: 44px; height: 44px; padding: 0;
    display: grid; place-items: center;
  }
  .arrow svg { display: block; }
  .stage-meta { text-align: center; margin-top: 12px; }
  .age { color: var(--accent); line-height: 1; }
  .age .num { font-size: 64px; }
  .unit { font-size: 16px; margin-left: 6px; letter-spacing: .12em; }
  .pos { margin: 0; color: var(--muted); font-size: 13px; letter-spacing: .08em; }
  .pname { margin: 8px 0 0; font-size: 18px; letter-spacing: .06em; }
  .pname.is-empty { color: var(--muted); }
  .pgroup { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .slider-wrap { max-width: 460px; margin: 8px auto 0; }
  .slider {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 28px; background: transparent; margin: 0;
  }
  .slider::-webkit-slider-runnable-track { height: 1px; background: var(--line); }
  .slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; border-radius: 0;
    background: var(--accent); border: 0; margin-top: -7px; cursor: pointer;
  }
  .slider::-moz-range-track { height: 1px; background: var(--line); border: 0; }
  .slider::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 0;
    background: var(--accent); border: 0; cursor: pointer;
  }
  .controls { justify-content: center; margin-top: 8px; }
  .hint.center, #orderMode { text-align: center; }
  .thumbs {
    display: flex; gap: 12px; overflow-x: auto;
    padding: 16px 8px 18px; align-items: flex-end;
    margin-top: 8px;
  }
  .gdiv {
    flex: 0 0 auto; width: 76px; align-self: stretch;
    display: flex; flex-direction: column; justify-content: center; gap: 4px;
    border-left: 1px solid var(--accent); padding: 0 8px; color: var(--accent);
  }
  .gdiv-zh { font-family: var(--font-cn); letter-spacing: .12em; font-size: 13px; }
  .gdiv-en { font-family: var(--font-en); font-size: 11px; letter-spacing: .04em; color: var(--muted); }
  html[lang="en"] .gdiv-en { color: var(--accent); }
  html[lang="en"] .gdiv-zh { color: var(--muted); }
  .titem { flex: 0 0 auto; width: 72px; text-align: center; }
  .thumb {
    width: 72px; aspect-ratio: 3 / 4;
    border: 2px solid transparent; padding: 0;
    background: var(--deep); position: relative;
    cursor: grab; display: block;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  .thumb.is-on { border: 2px solid var(--accent); transform: scale(1.08); z-index: 2; }
  .thumb.is-dragging { opacity: .4; }
  .thumb.is-over { border-color: var(--accent); transform: scale(1.06); z-index: 3; }
  .thumb.is-on.is-over { transform: scale(1.08); }
  .tage { display: block; margin-top: 6px; font-size: 12px; color: var(--muted); }
  .titem:has(.is-on) .tage { color: var(--accent); }
  .gbars { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .gbar {
    border: 1px solid var(--accent);
    padding: 8px 10px;
    display: flex; flex-wrap: wrap; gap: 8px;
    align-items: baseline;
    font-size: 12px;
  }
  .gbar b { color: var(--accent); font-weight: 500; letter-spacing: .08em; }
  .gbar .en { font-family: var(--font-en); color: var(--muted); }

  .lib-back, .modal-back {
    position: fixed; inset: 0; z-index: 30;
    background: rgba(2, 21, 51, .72);
  }
  .lib {
    position: absolute; top: 0; right: 0; bottom: 0;
    width: min(440px, 100%);
    background: var(--deep);
    border-left: 1px solid var(--line);
    overflow: auto;
    padding: 20px;
  }
  .lib-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
  .lib-head h2 { margin: 0; font-family: var(--font-cn); letter-spacing: .22em; font-size: 20px; font-weight: 500; }
  html[lang="en"] .lib-head h2 { font-family: var(--font-en); }
  .lib-card {
    display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 12px;
    border: 1px solid var(--line); background: var(--surface);
    padding: 10px; margin-top: 10px; cursor: pointer; text-align: left;
  }
  .lib-card:hover { border-color: var(--accent); }
  .lib-card img { width: 84px; aspect-ratio: 3 / 4; object-fit: cover; display: block; border: 1px solid var(--line); }
  .lib-card h3 { margin: 0 0 6px; font-size: 16px; line-height: 1.35; overflow-wrap: anywhere; }
  .meta-line { margin: 0 0 4px; color: var(--muted); font-size: 12px; line-height: 1.45; }
  .meta-line b { font-weight: 500; color: var(--fg); }
  .meta-line.is-accent { color: var(--accent); }
  .lib-actions { margin-top: 16px; }
  .modal-back { z-index: 40; display: grid; place-items: center; padding: 16px; }
  .modal { width: min(440px, 100%); background: var(--surface); border: 1px solid var(--line); padding: 20px; }
  .modal h3 { margin: 0 0 8px; font-family: var(--font-cn); letter-spacing: .16em; font-size: 18px; font-weight: 500; }
  html[lang="en"] .modal h3 { font-family: var(--font-en); }
  .modal p { margin: 0 0 16px; color: var(--muted); }
  .toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    z-index: 50; background: var(--deep); border: 1px solid var(--accent);
    color: var(--fg); padding: 10px 16px; max-width: calc(100% - 32px);
  }

  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
  }
  @media (max-width: 720px) {
    h1 { font-size: 26px; }
    .progress { flex-direction: column; }
    .progress li { border-right: 0; border-bottom: 1px solid var(--line); }
    .progress li:last-child { border-bottom: 0; }
    .fields { grid-template-columns: 1fr; }
    .stage-row { grid-template-columns: 44px minmax(0, 1fr) 44px; }
    .age .num { font-size: 52px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .stage img { transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <header>
      <div>
        <div class="brand">
          <span class="brand-cn">人物</span>
          <span class="brand-en">People</span>
        </div>
        <h1 data-i18n="title"></h1>
        <p class="sub" data-i18n="subtitle"></p>
      </div>
      <div class="header-actions">
        <button id="btnLib" type="button" data-i18n="lib"></button>
        <button id="btnReset" type="button" data-i18n="reset"></button>
        <button id="btnLang" type="button">EN</button>
      </div>
    </header>
    <ol class="progress" id="progress">
      <li data-step="1"><span class="badge">01</span><span class="lab" data-i18n="ind1"></span></li>
      <li data-step="2"><span class="badge">02</span><span class="lab" data-i18n="ind2"></span></li>
      <li data-step="3"><span class="badge">03</span><span class="lab" data-i18n="ind3"></span></li>
      <li data-step="4"><span class="badge">04</span><span class="lab" data-i18n="ind4"></span></li>
    </ol>
  </div>

  <div class="layout">
    <div class="stack">
      <section id="panel1" class="panel">
        <div class="panel-head"><span class="kicker">01</span><h2 data-i18n="step1"></h2></div>
        <label class="field">
          <span data-i18n="nameLabel"></span>
          <input id="nameInput" type="text" maxlength="80" autocomplete="off" data-i18n-placeholder="namePh">
        </label>
        <p id="nameState" class="name-state"></p>
        <p class="hint" data-i18n="nameHelp"></p>
      </section>

      <section id="panel2" class="panel is-locked">
        <div class="panel-head"><span class="kicker">02</span><h2 data-i18n="step2"></h2></div>
        <label id="drop" class="drop">
          <input id="fileInput" class="sr" type="file" accept="image/*" multiple>
          <span class="drop-title" data-i18n="drop"></span>
          <span class="drop-sub" data-i18n="dropSub"></span>
          <span id="uploadCount" class="drop-count num"></span>
        </label>
      </section>

      <section id="panel3" class="panel is-locked">
        <div class="panel-head"><span class="kicker">03</span><h2 data-i18n="step3"></h2></div>
        <div id="editList" class="edit-list"></div>
      </section>
    </div>

    <section id="panel4" class="panel is-locked">
      <div class="panel-head"><span class="kicker">04</span><h2 data-i18n="step4"></h2></div>
      <p id="empty" class="empty" data-i18n="empty"></p>
      <div id="viewer" hidden>
        <div class="stage-row">
          <button id="btnPrev" class="arrow" type="button" aria-label="Previous">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 L8 12 L15 19" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
          </button>
          <div class="stage"><img id="stageImg" alt=""></div>
          <button id="btnNext" class="arrow" type="button" aria-label="Next">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5 L16 12 L9 19" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
          </button>
        </div>
        <div class="stage-meta" id="stageMeta">
          <p class="pos num" id="stagePos"></p>
          <div class="age"><span id="stageAge" class="num"></span><span id="stageUnit" class="unit"></span></div>
          <p class="pname" id="stageTitle"></p>
          <p class="pgroup" id="stageGroup"></p>
        </div>
        <div class="slider-wrap">
          <input id="slider" class="slider" type="range" min="0" max="0" step="any" value="0">
        </div>
        <div class="controls">
          <button id="btnPlay" type="button" aria-pressed="false"></button>
          <button id="btnExport" type="button"></button>
          <button id="btnSave" type="button"></button>
          <button id="btnSort" type="button"></button>
        </div>
        <p id="orderMode" class="hint"></p>
        <p class="hint center" data-i18n="keys"></p>
        <div id="thumbStrip" class="thumbs"></div>
        <div id="groupBars" class="gbars"></div>
      </div>
    </section>
  </div>
</div>

<div id="libBack" class="lib-back" hidden>
  <aside class="lib" role="dialog" aria-modal="true" aria-labelledby="libTitle">
    <div class="lib-head">
      <h2 id="libTitle" data-i18n="lib"></h2>
      <button id="btnCloseLib" type="button" data-i18n="close"></button>
    </div>
    <div id="libList"></div>
    <div class="lib-actions">
      <button id="btnClearLib" type="button" data-i18n="clearAll"></button>
    </div>
  </aside>
</div>

<div id="modal" class="modal-back" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h3 id="modalTitle"></h3>
    <p id="modalBody"></p>
    <div class="modal-actions">
      <button id="modalCancel" type="button"></button>
      <button id="modalOk" type="button"></button>
    </div>
  </div>
</div>
<div id="toast" class="toast" role="status" hidden></div>

<script>

  'use strict';

  var STORAGE_KEY = 'lifeStages_profiles';
  var PAGE_W = 1080;

  var FONT_EN = 'Cambria, "Times New Roman", "Liberation Serif", serif';
  var C = { bg: '#042352', deep: '#021533', surface: '#0b2d62', fg: '#f6f3ec', muted: '#9eb0c6', line: '#1d447c', accent: '#c9a36a' };

    { id: 'child', zh: '幼年', en: 'Childhood', min: 0, max: 6, range: '0–6' },

  ];

      step1: '填写档案名称',
      step2: '上传照片（自动裁剪为 3:4）',
      step3: '填写年龄和照片名称',
      step4: '拖拽缩略图调整顺序',
      nameLabel: '档案名称',
      namePh: '例如：张三',
      nameHelp: '回车或失焦后保存',
      recorded: '名称已保存',
      unsaved: '未保存',
      drop: '点击或拖拽上传照片',
      dropSub: '可多张。自动居中裁剪为 3:4，不拉伸。',
      uploaded: '已上传 {n} 张',
      age: '年龄', required: '必填', photoName: '照片名称', optional: '选填',
      photoPh: '选填',
      remove: '移除',

      play: '播放', stop: '停止',
      export: '导出', exporting: '导出中',
      save: '保存到人物库',

      orderManual: '当前顺序：手动',
      orderAuto: '当前顺序：按年龄',
      prev: '上一张', next: '下一张',
      lib: '人物库', reset: '重置', close: '关闭', clearAll: '清空全部',
      delete: '删除',
      stages: '阶段总数', spanLabel: '年龄跨度', updated: '最后修改',
      emptyLib: '人物库为空',
      untitled: '未命名',
      unit: '岁',

  /* 原图偏宽裁左右，偏高裁上下，输出固定 3:4，不拉伸。 */
  function cropTo34(img) {
    var ratio = 3 / 4;
    var sr = img.width / img.height;
    var sx = 0, sy = 0, sw = img.width, sh = img.height;
    if (sr > ratio) {
      sh = img.height;
      sw = sh * ratio;
      sx = (img.width - sw) / 2;
    } else {
      sw = img.width;
      sh = sw / ratio;
      sy = (img.height - sh) / 2;
    }
    sx = Math.max(0, Math.round(sx));
    sy = Math.max(0, Math.round(sy));
    sw = Math.min(img.width - sx, Math.round(sw));
    sh = Math.min(img.height - sy, Math.round(sh));
    var canvas = document.createElement('canvas');
    canvas.width = 750;
    canvas.height = 1000;
    var ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, sx, sy, sw, sh, 0, 0, 750, 1000);
    return canvas.toDataURL('image/jpeg', 0.84);
  }
  function fileToImage(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        URL.revokeObjectURL(url);
        if (!img.width || !img.height) reject(new Error('empty'));
        else resolve(img);
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('read')); };
      img.src = url;
    });
  }
  async function addFiles(fileList) {

    if (!files.length) { toast(t('notImage')); return; }
    busy = true;
    $('drop').setAttribute('aria-busy', 'true');
    var failed = 0;
    var focusId = state.photos[state.index] && state.photos[state.index].id;

        var img = await fileToImage(files[i]);

  /* 手动顺序覆盖自动排序；拖完后仍停在同一张照片。 */
  function reorder(srcId, targetId, clientX, targetEl) {
    if (!srcId || !targetId || srcId === targetId) return;
    var focusId = state.photos[state.index] && state.photos[state.index].id;
    var from = state.photos.findIndex(function (p) { return p.id === srcId; });
    if (from < 0) return;
    var item = state.photos.splice(from, 1)[0];
    var to = state.photos.findIndex(function (p) { return p.id === targetId; });
    if (to < 0) state.photos.push(item);
    else {
      var after = false;
      if (targetEl && clientX != null) {
        var rect = targetEl.getBoundingClientRect();
        after = clientX > rect.left + rect.width / 2;
      }
      state.photos.splice(to + (after ? 1 : 0), 0, item);
    }
    state.manual = true;
    reindex(focusId);
    renderEditList();
    renderThumbs();
    renderGroupBars();
    renderStage({ animate: false });
    renderOrder();
  }
  function moveToEnd(srcId) {
    var focusId = state.photos[state.index] && state.photos[state.index].id;
    var from = state.photos.findIndex(function (p) { return p.id === srcId; });
    if (from < 0 || from === state.photos.length - 1) return;
    var item = state.photos.splice(from, 1)[0];
    state.photos.push(item);
    state.manual = true;
    reindex(focusId);
    renderEditList();
    renderThumbs();
    renderGroupBars();
    renderStage({ animate: false });
    renderOrder();
  }

  });
  $('thumbStrip').addEventListener('dragover', function (e) {
    if (!state.dragId) return;
    var thumb = e.target.closest('.thumb');
    e.preventDefault();
    document.querySelectorAll('.thumb.is-over').forEach(function (el) { el.classList.remove('is-over'); });
    if (thumb && thumb.dataset.id !== state.dragId) thumb.classList.add('is-over');
  });
  $('thumbStrip').addEventListener('drop', function (e) {
    e.preventDefault();
    var thumb = e.target.closest('.thumb');
    var srcId = state.dragId || (e.dataTransfer && e.dataTransfer.getData('text/plain'));
    if (thumb && srcId) reorder(srcId, thumb.dataset.id, e.clientX, thumb);
    else if (srcId) moveToEnd(srcId);
    document.querySelectorAll('.thumb').forEach(function (el) { el.classList.remove('is-dragging', 'is-over'); });
  });

  /* 触屏上 HTML5 拖拽不可靠：长按后用指针拖动，逻辑与 drop 相同。 */
  $('thumbStrip').addEventListener('pointerdown', function (e) {
    if (e.pointerType !== 'touch') return;
    var thumb = e.target.closest('.thumb');
    if (!thumb || !flags().s4) return;
    var startX = e.clientX, startY = e.clientY, pid = e.pointerId;
    var armed = false, overEl = null, touchX = startX;
    var timer = window.setTimeout(function () {
      armed = true;
      thumb.classList.add('is-dragging');
      try { thumb.setPointerCapture(pid); } catch (err) { /* ignore */ }
    }, 220);
    function move(ev) {
      if (ev.pointerId !== pid) return;
      if (!armed) {
        if (Math.hypot(ev.clientX - startX, ev.clientY - startY) > 10) {
          window.clearTimeout(timer);
          cleanup();
        }
        return;
      }
      ev.preventDefault();
      touchX = ev.clientX;
      var el = document.elementFromPoint(ev.clientX, ev.clientY);
      var over = el && el.closest ? el.closest('.thumb') : null;
      document.querySelectorAll('.thumb.is-over').forEach(function (n) { n.classList.remove('is-over'); });
      if (over && over.dataset.id !== thumb.dataset.id) { over.classList.add('is-over'); overEl = over; }
      else overEl = null;
    }
    function up(ev) {
      if (ev.pointerId !== pid) return;
      window.clearTimeout(timer);
      if (armed) {
        thumb.classList.remove('is-dragging');
        document.querySelectorAll('.thumb.is-over').forEach(function (n) { n.classList.remove('is-over'); });
        if (overEl) reorder(thumb.dataset.id, overEl.dataset.id, touchX, overEl);
      }
      cleanup();
    }
    function cleanup() {
      thumb.removeEventListener('pointermove', move);
      thumb.removeEventListener('pointerup', up);
      thumb.removeEventListener('pointercancel', up);
    }
    thumb.addEventListener('pointermove', move, { passive: false });
    thumb.addEventListener('pointerup', up);
    thumb.addEventListener('pointercancel', up);
  });

  $('btnLib').addEventListener('click', openLib);
  $('btnLang').addEventListener('click', function () {
    state.lang = state.lang === 'zh' ? 'en' : 'zh';
    try { localStorage.setItem('lifeStages_lang', state.lang); } catch (err) { /* ignore */ }
    renderAll();
  });
  $('btnCloseLib').addEventListener('click', closeLib);
  $('libBack').addEventListener('click', function (e) { if (e.target === $('libBack')) closeLib(); });
  $('libList').addEventListener('click', function (e) {
    var del = e.target.closest('[data-del]');
    if (del) { e.stopPropagation(); deleteProfile(del.dataset.del); return; }
    var card = e.target.closest('[data-open]');
    if (card) openProfile(card.dataset.open);
  });
  $('btnClearLib').addEventListener('click', async function () {
    if (!loadProfiles().length) return;
    var ok = await askConfirm(t('confirmClearTitle'), t('confirmClearBody'), t('confirmClearOk'), t('cancel'));
    if (!ok) return;
    localStorage.removeItem(STORAGE_KEY);
    state.activeProfileId = null;
    renderLibrary();
  });
  $('btnReset').addEventListener('click', async function () {
    var ok = await askConfirm(t('confirmResetTitle'), t('confirmResetBody'), t('confirmResetOk'), t('cancel'));
    if (!ok) return;
    stopPlay();
    state.name = '';
    state.photos = [];
    state.manual = false;
    state.index = 0;
    state.activeProfileId = null;
    state.sliderHold = false;
    $('nameInput').value = '';
    var img = $('stageImg');
    img.removeAttribute('src');
    delete img.dataset.pid;
    renderAll();
  });
  $('modalOk').addEventListener('click', function () { closeModal(true); });
  $('modalCancel').addEventListener('click', function () { closeModal(false); });
  $('modal').addEventListener('click', function (e) { if (e.target === $('modal')) closeModal(false); });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (!$('modal').hidden) { closeModal(false); return; }
      if (!$('libBack').hidden) { closeLib(); return; }
    }
    var tag = (e.target.tagName || '').toLowerCase();
    var typing = tag === 'textarea' || e.target.isContentEditable || (tag === 'input' && e.target.id !== 'slider');
    if (typing || overlayOpen() || !flags().s4) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(state.index - 1, true); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); goTo(state.index + 1, true); }
    else if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  });

  renderAll();
})();
</script>
</body>
</html>
